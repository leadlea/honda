name: Deploy Honda Veteran Talent Matching System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Set deployment stage
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "STAGE=prod" >> $GITHUB_ENV
          else
            echo "STAGE=dev" >> $GITHUB_ENV
          fi

      - name: Deploy backend services
        run: |
          npx serverless deploy --stage ${{ env.STAGE }} --config serverless-minimal.yml
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

      - name: Verify deployment
        run: |
          echo "Backend deployment completed successfully for stage: ${{ env.STAGE }}"
          echo "Skipping integration tests - no tests defined yet"

  deploy-frontend:
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set deployment stage
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "STAGE=prod" >> $GITHUB_ENV
          else
            echo "STAGE=dev" >> $GITHUB_ENV
          fi

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy Frontend using deployment script
        run: |
          chmod +x scripts/deploy-frontend.sh
          ./scripts/deploy-frontend.sh ${{ env.STAGE }}
        env:
          FRONTEND_BUCKET_NAME: honda-hr-bank
          FRONTEND_BUCKET_REGION: ap-northeast-1
          CLOUDFRONT_DISTRIBUTION_ID: E1T3WQ2YHO1BNA
          CLOUDFRONT_DOMAIN: doy5alruji476.cloudfront.net

      - name: Prepare CloudFront Configuration
        run: |
          chmod +x scripts/prepare-cloudfront.sh
          ./scripts/prepare-cloudfront.sh ${{ env.STAGE }}

      - name: Upload CloudFront artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudfront-config-${{ env.STAGE }}
          path: |
            cloudfront-config-${{ env.STAGE }}.json
            CLOUDFRONT_DEPLOYMENT_INSTRUCTIONS.md
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'