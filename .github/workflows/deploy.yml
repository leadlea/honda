name: Deploy Honda Veteran Talent Matching System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Set deployment stage
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "STAGE=prod" >> $GITHUB_ENV
          else
            echo "STAGE=dev" >> $GITHUB_ENV
          fi

      - name: Cleanup old Lambda versions
        run: |
          chmod +x scripts/cleanup-lambda-versions.sh
          ./scripts/cleanup-lambda-versions.sh || echo "Cleanup failed, continuing with deployment"

      - name: Deploy backend services (FULL)
        run: |
          # fail-fast if required env is missing
          test -n "${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}" || (echo "COGNITO_USER_POOL_ID missing" && exit 1)
          test -n "${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}" || (echo "COGNITO_CLIENT_ID missing" && exit 1)
          npx serverless deploy --stage $STAGE --config serverless.yml
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          # Cognito設定をLambda環境変数として注入
          COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}

      - name: Verify deployment
        run: |
          echo "Backend deployment completed successfully for stage: $STAGE"
          echo "Skipping integration tests - no tests defined yet"

  deploy-frontend:
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set deployment stage
        id: set_stage
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "STAGE=prod" >> $GITHUB_ENV
            echo "stage=prod" >> $GITHUB_OUTPUT
          else
            echo "STAGE=dev" >> $GITHUB_ENV
            echo "stage=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Debug - Check frontend public directory
        run: |
          echo "Checking frontend/public directory contents:"
          ls -la frontend/public/
          echo "Checking if index.html exists:"
          test -f frontend/public/index.html && echo "✅ index.html exists" || echo "❌ index.html missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy Frontend using deployment script
        env:
          # ==== REQUIRED by the script (Secrets優先) ====
          REACT_APP_COGNITO_CLIENT_ID:    ${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}     # 1f62alqbqneo30qb0giarl9dva
          REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}  # ap-northeast-1_wkRvKeooL
          REACT_APP_API_URL:              ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_REGION:               ${{ secrets.REACT_APP_REGION }}
          # ==== Hosting settings ====
          FRONTEND_BUCKET_NAME:           honda-hr-bank
          FRONTEND_BUCKET_REGION:         ap-northeast-1
          CLOUDFRONT_DISTRIBUTION_ID:     E1T3WQ2YHO1BNA
          CLOUDFRONT_DOMAIN:              doy5alruji476.cloudfront.net
        run: |
          chmod +x scripts/deploy-frontend.sh
          ./scripts/deploy-frontend.sh $STAGE

      - name: Prepare CloudFront Configuration
        run: |
          chmod +x scripts/prepare-cloudfront.sh
          ./scripts/prepare-cloudfront.sh $STAGE

      - name: Upload CloudFront artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudfront-config-${{ steps.set_stage.outputs.stage }}
          path: |
            cloudfront-config-${{ steps.set_stage.outputs.stage }}.json
            CLOUDFRONT_DEPLOYMENT_INSTRUCTIONS.md
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

