service: honda-veteran-talent-matching

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.12
  region: ap-northeast-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    DYNAMODB_TABLE_PREFIX: ${self:service}-${self:provider.stage}
    BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
    COGNITO_USER_POOL_ID: ${cf:${self:service}-${self:provider.stage}.CognitoUserPoolId, ''}
    COGNITO_CLIENT_ID: ${cf:${self:service}-${self:provider.stage}.CognitoClientId, ''}
    KMS_KEY_ID: ${cf:${self:service}-${self:provider.stage}.KMSKeyId, ''}
    ENCRYPTION_PASSWORD: ${env:ENCRYPTION_PASSWORD, 'default-dev-key'}
    ENCRYPTION_SALT: ${env:ENCRYPTION_SALT, 'default-dev-salt'}
    PII_HASH_SALT: ${env:PII_HASH_SALT, 'default-pii-salt'}
    ENVIRONMENT: ${self:provider.stage}
    BEDROCK_CACHE_TTL: ${env:BEDROCK_CACHE_TTL, '300'}
    DYNAMODB_MAX_RETRIES: ${env:DYNAMODB_MAX_RETRIES, '3'}
    CONNECTION_POOL_SIZE: ${env:CONNECTION_POOL_SIZE, '50'}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_PREFIX}-*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE_PREFIX}-*/index/*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - "arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
          Resource:
            - "arn:aws:cognito-idp:${self:provider.region}:*:userpool/*"
        - Effect: Allow
          Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:GenerateDataKey
            - kms:DescribeKey
          Resource:
            - "arn:aws:kms:${self:provider.region}:*:key/*"

functions:
  authHandler:
    handler: src/handlers/auth_handler.handler
    timeout: 29
    events:
      - http:
          path: auth/login
          method: POST
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
      - http:
          path: auth/logout
          method: POST
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
      - http:
          path: auth/profile
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer
      - http:
          path: auth/permissions
          method: PUT
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  profileHandler:
    handler: src/handlers/profile_handler.handler
    timeout: 29
    events:
      - http:
          path: profiles/{userId}
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: profiles/{userId}
          method: PUT
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: profiles/{userId}/privacy
          method: PUT
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }

  businessTitleHandler:
    handler: src/handlers/business_title_handler.handler
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: profiles/{userId}/business-title
          method: POST
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }

  questionnaireHandler:
    handler: src/handlers/questionnaire_handler.handler
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: questionnaire/{userId}
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: questionnaire/{userId}/submit
          method: POST
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: questionnaire/{userId}/history
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: questionnaire/{userId}/regenerate
          method: PUT
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }

  matchingHandler:
    handler: src/handlers/matching_handler.lambda_handler
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: recommendations/{userId}
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }

  applicationHandler:
    handler: src/handlers/application_handler.handler
    timeout: 29
    events:
      - http:
          path: applications/{userId}
          method: POST
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: applications/{applicationId}/status
          method: PUT
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }
      - http:
          path: opportunities/search
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: { Ref: ApiGatewayAuthorizer }

  publicSearchHandler:
    handler: src/handlers/public_search_handler.handler
    timeout: 29
    events:
      - http:
          path: public/veterans/search
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
      - http:
          path: public/veterans/{profileId}
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false
      - http:
          path: public/categories
          method: GET
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false

  contactHandler:
    handler: src/handlers/contact_handler.handler
    timeout: 29
    events:
      - http:
          path: public/contact/{profileId}
          method: POST
          cors:
            origin: '*'
            headers: [Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token, X-Amz-User-Agent]
            allowCredentials: false

resources:
  Resources:
    ApiGatewayAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoAuthorizer
        Type: COGNITO_USER_POOLS
        RestApiId: { Ref: ApiGatewayRestApi }
        IdentitySource: method.request.header.Authorization
        ProviderARNs:
          - Fn::GetAtt: [CognitoUserPool, Arn]

    # KMS
    KMSKey:
      Type: AWS::KMS::Key
      Properties:
        Description: KMS key for Honda Veteran Bank data encryption
        KeyPolicy:
          Statement:
            - Sid: Enable IAM User Permissions
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: 'kms:*'
              Resource: '*'
            - Sid: Allow Lambda functions to use the key
              Effect: Allow
              Principal:
                AWS: !GetAtt IamRoleLambdaExecution.Arn
              Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
              Resource: '*'
    KMSKeyAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/${self:service}-${self:provider.stage}-encryption-key
        TargetKeyId: !Ref KMSKey

    # Cognito
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-user-pool
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-client
        UserPoolId: { Ref: CognitoUserPool }
        GenerateSecret: false
        ExplicitAuthFlows: [ADMIN_NO_SRP_AUTH, USER_PASSWORD_AUTH]
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        SupportedIdentityProviders: [COGNITO]
        AllowedOAuthScopes: [openid, email, profile]
        CallbackURLs:
          - https://doy5alruji476.cloudfront.net
          - https://doy5alruji476.cloudfront.net/
        LogoutURLs:
          - https://doy5alruji476.cloudfront.net
          - https://doy5alruji476.cloudfront.net/

    # API Key / Usage Plan
    ApiGatewayUsagePlan:
      Type: AWS::ApiGateway::UsagePlan
      Properties:
        UsagePlanName: ${self:service}-${self:provider.stage}-usage-plan
        Description: Usage plan for ${self:service}
        Throttle: { BurstLimit: 200, RateLimit: 100 }
        Quota: { Limit: 10000, Period: DAY }
        ApiStages:
          - ApiId: { Ref: ApiGatewayRestApi }
            Stage: ${self:provider.stage}

    ApiGatewayApiKey:
      Type: AWS::ApiGateway::ApiKey
      Properties:
        Name: ${self:service}-${self:provider.stage}-api-key
        Description: API key for ${self:service}
        Enabled: true

    ApiGatewayUsagePlanKey:
      Type: AWS::ApiGateway::UsagePlanKey
      Properties:
        KeyId: { Ref: ApiGatewayApiKey }
        KeyType: API_KEY
        UsagePlanId: { Ref: ApiGatewayUsagePlan }

    # GatewayResponses (CORS for 4xx/5xx)
    ApiGatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'https://doy5alruji476.cloudfront.net'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
    ApiGatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'https://doy5alruji476.cloudfront.net'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

    # DynamoDB Tables
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-users
        AttributeDefinitions:
          - { AttributeName: user_id, AttributeType: S }
          - { AttributeName: email,   AttributeType: S }
        KeySchema:
          - { AttributeName: user_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - { AttributeName: email, KeyType: HASH }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    VeteranProfilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-veteran-profiles
        AttributeDefinitions:
          - { AttributeName: user_id,            AttributeType: S }
          - { AttributeName: is_publicly_visible, AttributeType: S }
        KeySchema:
          - { AttributeName: user_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: PublicProfilesIndex
            KeySchema:
              - { AttributeName: is_publicly_visible, KeyType: HASH }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    OpportunitiesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-opportunities
        AttributeDefinitions:
          - { AttributeName: opportunity_id, AttributeType: S }
          - { AttributeName: type,           AttributeType: S }
          - { AttributeName: posted_date,    AttributeType: S }
        KeySchema:
          - { AttributeName: opportunity_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: TypeDateIndex
            KeySchema:
              - { AttributeName: type,        KeyType: HASH }
              - { AttributeName: posted_date, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    RecommendationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-recommendations
        AttributeDefinitions:
          - { AttributeName: user_id,            AttributeType: S }
          - { AttributeName: recommendation_id,  AttributeType: S }
        KeySchema:
          - { AttributeName: user_id,           KeyType: HASH }
          - { AttributeName: recommendation_id, KeyType: RANGE }
        BillingMode: PAY_PER_REQUEST

    QuestionnairesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-questionnaires
        AttributeDefinitions:
          - { AttributeName: questionnaire_id, AttributeType: S }
          - { AttributeName: user_id,          AttributeType: S }
        KeySchema:
          - { AttributeName: questionnaire_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - { AttributeName: user_id, KeyType: HASH }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    QuestionnaireResponsesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-questionnaire-responses
        AttributeDefinitions:
          - { AttributeName: user_id,   AttributeType: S }
          - { AttributeName: response_id, AttributeType: S }
        KeySchema:
          - { AttributeName: user_id,   KeyType: HASH }
          - { AttributeName: response_id, KeyType: RANGE }
        BillingMode: PAY_PER_REQUEST

    ApplicationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-applications
        AttributeDefinitions:
          - { AttributeName: application_id, AttributeType: S }
          - { AttributeName: user_id,       AttributeType: S }
          - { AttributeName: opportunity_id, AttributeType: S }
        KeySchema:
          - { AttributeName: application_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - { AttributeName: user_id, KeyType: HASH }
            Projection: { ProjectionType: ALL }
          - IndexName: OpportunityIdIndex
            KeySchema:
              - { AttributeName: opportunity_id, KeyType: HASH }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    PublicProfilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-public-profiles
        AttributeDefinitions:
          - { AttributeName: profile_id, AttributeType: S }
          - { AttributeName: user_id,    AttributeType: S }
        KeySchema:
          - { AttributeName: profile_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - { AttributeName: user_id, KeyType: HASH }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    ContactRequestsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PREFIX}-contact-requests
        AttributeDefinitions:
          - { AttributeName: request_id, AttributeType: S }
          - { AttributeName: profile_id, AttributeType: S }
          - { AttributeName: created_at, AttributeType: S }
        KeySchema:
          - { AttributeName: request_id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: ProfileIdDateIndex
            KeySchema:
              - { AttributeName: profile_id, KeyType: HASH }
              - { AttributeName: created_at, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        BillingMode: PAY_PER_REQUEST

    # S3 Bucket for Frontend
    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-frontend
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: error.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: { Ref: FrontendBucket }
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                Fn::Sub: "arn:aws:s3:::${FrontendBucket}/*"

  Outputs:
    KMSKeyId:
      Value: { Ref: KMSKey }
      Export: { Name: ${self:service}-${self:provider.stage}-kms-key-id }
    KMSKeyArn:
      Value: { Fn::GetAtt: [KMSKey, Arn] }
      Export: { Name: ${self:service}-${self:provider.stage}-kms-key-arn }
    CognitoUserPoolId:
      Value: { Ref: CognitoUserPool }
      Export: { Name: ${self:service}-${self:provider.stage}-cognito-user-pool-id }
    CognitoClientId:
      Value: { Ref: CognitoUserPoolClient }
      Export: { Name: ${self:service}-${self:provider.stage}-cognito-client-id }
    ApiGatewayUrl:
      Value:
        Fn::Sub: "https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}"
      Export: { Name: ${self:service}-${self:provider.stage}-api-gateway-url }
    ApiGatewayApiKey:
      Value: { Ref: ApiGatewayApiKey }
      Export: { Name: ${self:service}-${self:provider.stage}-api-key }
    FrontendBucketName:
      Value: { Ref: FrontendBucket }
      Export: { Name: ${self:service}-${self:provider.stage}-frontend-bucket }
    FrontendBucketUrl:
      Value: { Fn::GetAtt: [FrontendBucket, WebsiteURL] }
      Export: { Name: ${self:service}-${self:provider.stage}-frontend-url }

plugins:
  - serverless-python-requirements
  - serverless-offline

custom:
  pythonRequirements:
    dockerizePip: true
    pythonBin: python3.12
